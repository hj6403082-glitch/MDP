# ============================================================================
# Cloud Build config: build and push the MDP custom runtime image.
#
# Builds the Dockerfile and pushes it to Artifact Registry, tagged with both
# the commit SHA (immutable, for reproducible batch submissions) and `latest`.
#
# Manual run:
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_AR_REPO=mdp
#
# CI run (build trigger): create a trigger on this repo pointing at
# cloudbuild.yaml. $PROJECT_ID and $COMMIT_SHA are provided automatically;
# override _REGION / _AR_REPO / _IMAGE as needed in the trigger's substitutions.
#
# Prerequisite (one-time): create the Artifact Registry repo, e.g.
#   gcloud artifacts repositories create mdp \
#     --repository-format=docker --location=us-central1
# ============================================================================

substitutions:
  _REGION: us-central1          # Artifact Registry + build region
  _AR_REPO: mdp                 # Artifact Registry repository name
  _IMAGE: mdp-runtime           # image name within the repository

# Tag with the commit SHA when available (CI), else fall back to a stable tag.
# _IMAGE_PATH is the full "REGION-docker.pkg.dev/PROJECT/REPO/IMAGE" prefix.
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8     # dependency install (xgboost/shap/...) is heavy

steps:
  # 1) Build the image, tagging both :$COMMIT_SHA (or :manual) and :latest.
  - name: gcr.io/cloud-builders/docker
    id: build
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        PREFIX="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}"
        SHA_TAG="${COMMIT_SHA:-manual}"
        echo "Building $PREFIX:$SHA_TAG and $PREFIX:latest"
        docker build \
          -t "$PREFIX:$SHA_TAG" \
          -t "$PREFIX:latest" \
          .

  # 2) Push both tags.
  - name: gcr.io/cloud-builders/docker
    id: push
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        PREFIX="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}"
        docker push --all-tags "$PREFIX"

# Record the built images in the build metadata.
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:latest"

timeout: 1800s   # 30 min; the dependency layer can take a while to build.
